<!DOCTYPE html>
<html>
<head>
  <title>2 Player Ping Pong</title>

  <style>
    body {
      background-color: #111;
      color: white;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    canvas {
      background-color: black;
      border: 4px solid white;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 60px;
    }
  </style>
</head>

<body>

  <h1>Ping Pong</h1>

  <div class="controls">
    <p>Player 1: W / S</p>
    <p>Player 2: ↑ / ↓</p>
  </div>

  <canvas id="gameCanvas" width="800" height="500"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const paddleWidth = 15;
    const paddleHeight = 100;
    const paddleSpeed = 7;

    let player1Y = 200;
    let player2Y = 200;

    let ballX = 400;
    let ballY = 250;

    const ballSize = 15;

    let ballSpeedX = 5;
    let ballSpeedY = 4;

    let player1Score = 0;
    let player2Score = 0;

    const keys = {};

    document.addEventListener("keydown", function(event) {
      keys[event.key] = true;

      // Stop arrow keys from scrolling the page
      if (
        event.key === "ArrowUp" ||
        event.key === "ArrowDown"
      ) {
        event.preventDefault();
      }
    });

    document.addEventListener("keyup", function(event) {
      keys[event.key] = false;
    });

    function update() {

      // Player 1
      if (keys["w"] || keys["W"]) {
        player1Y -= paddleSpeed;
      }

      if (keys["s"] || keys["S"]) {
        player1Y += paddleSpeed;
      }

      // Player 2
      if (keys["ArrowUp"]) {
        player2Y -= paddleSpeed;
      }

      if (keys["ArrowDown"]) {
        player2Y += paddleSpeed;
      }

      // Keep player 1 inside
      if (player1Y < 0) {
        player1Y = 0;
      }

      if (player1Y + paddleHeight > canvas.height) {
        player1Y = canvas.height - paddleHeight;
      }

      // Keep player 2 inside
      if (player2Y < 0) {
        player2Y = 0;
      }

      if (player2Y + paddleHeight > canvas.height) {
        player2Y = canvas.height - paddleHeight;
      }

      // Move ball
      ballX += ballSpeedX;
      ballY += ballSpeedY;

      // Top wall
      if (ballY <= 0) {
        ballSpeedY *= -1;
      }

      // Bottom wall
      if (ballY + ballSize >= canvas.height) {
        ballSpeedY *= -1;
      }

      // Left paddle
      if (
        ballX <= 35 &&
        ballX + ballSize >= 20 &&
        ballY + ballSize >= player1Y &&
        ballY <= player1Y + paddleHeight
      ) {
        ballSpeedX = Math.abs(ballSpeedX);
      }

      // Right paddle
      if (
        ballX + ballSize >= 765 &&
        ballX <= 780 &&
        ballY + ballSize >= player2Y &&
        ballY <= player2Y + paddleHeight
      ) {
        ballSpeedX = -Math.abs(ballSpeedX);
      }

      // Player 2 scores
      if (ballX < 0) {
        player2Score++;
        resetBall();
      }

      // Player 1 scores
      if (ballX > canvas.width) {
        player1Score++;
        resetBall();
      }
    }

    function resetBall() {

      ballX = canvas.width / 2;
      ballY = canvas.height / 2;

      ballSpeedX *= -1;

      if (Math.random() > 0.5) {
        ballSpeedY = 4;
      } else {
        ballSpeedY = -4;
      }
    }

    function draw() {

      // Background
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Middle line
      ctx.strokeStyle = "white";
      ctx.lineWidth = 4;
      ctx.setLineDash([15, 15]);

      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();

      ctx.setLineDash([]);

      // Paddles
      ctx.fillStyle = "white";

      ctx.fillRect(
        20,
        player1Y,
        paddleWidth,
        paddleHeight
      );

      ctx.fillRect(
        canvas.width - 35,
        player2Y,
        paddleWidth,
        paddleHeight
      );

      // Ball
      ctx.fillRect(
        ballX,
        ballY,
        ballSize,
        ballSize
      );

      // Scores
      ctx.font = "40px Arial";

      ctx.fillText(
        player1Score,
        330,
        50
      );

      ctx.fillText(
        player2Score,
        450,
        50
      );
    }

    function gameLoop() {
      update();
      draw();

      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>

</body>
</html>
