<!DOCTYPE html>
<html>
<head>
  <title>Enzo's Game Hub</title>

  <style>
    body {
      background-color: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 50px;
    }

    .games {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 25px;
      margin-top: 50px;
    }

    .game {
      background-color: #222;
      border: 2px solid #444;
      border-radius: 15px;
      width: 220px;
      padding: 25px;
    }

    .game:hover {
      border-color: white;
    }

    .game h2 {
      margin-top: 0;
    }

    a {
      display: inline-block;
      background-color: white;
      color: black;
      text-decoration: none;
      padding: 10px 25px;
      border-radius: 8px;
      font-weight: bold;
    }

    a:hover {
      background-color: #ccc;
    }
  </style>
</head>

<body>

  <h1>🎮 Enzo's Game Hub</h1>

  <p>Pick a game</p>

  <div class="games">

    <div class="game">
      <h2>🏓 Pong</h2>
      <p>2 player ping pong</p>
      <a href="pong/">Play</a>
    </div>

    <div class="game">
      <h2>🐍 Snake</h2>
      <p>Classic snake game</p>
      <a href="snake/">Play</a>
    </div>

    <div class="game">
      <h2>❌ Tic Tac Toe</h2>
      <p>2 player tic tac toe</p>
      <a href="tic-tac-toe/">Play</a>
    </div>

  </div>

</body>
</html>
