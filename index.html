<!DOCTYPE html>
<html>
<head>
  <title>Enzo's Game Hub</title>

  <style>
    body {
      background-color: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    h1 {
      font-size: 50px;
      margin-top: 40px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      font-size: 18px;
    }

    .games {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 25px;
      margin-top: 50px;
      padding: 0 20px;
    }

    .game {
      background-color: #222;
      border: 2px solid #444;
      border-radius: 15px;
      width: 220px;
      padding: 25px;
      transition: 0.2s;
    }

    .game:hover {
      border-color: white;
      transform: translateY(-5px);
    }

    .game h2 {
      margin-top: 0;
    }

    .game p {
      color: #bbb;
      min-height: 40px;
    }

    a {
      display: inline-block;
      background-color: white;
      color: black;
      text-decoration: none;
      padding: 10px 25px;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.2s;
    }

    a:hover {
      background-color: #ccc;
      transform: scale(1.05);
    }

    footer {
      margin-top: 60px;
      padding: 25px;
      color: #777;
      font-size: 14px;
      border-top: 1px solid #222;
    }
  </style>
</head>

<body>

  <h1>🎮 Enzo's Game Hub</h1>

  <p class="subtitle">Pick a game</p>


  <div class="games">

    <div class="game">
      <h2>🏓 Pong</h2>
      <p>2 player ping pong</p>
      <a href="pong/">Play</a>
    </div>


    <div class="game">
      <h2>🐍 Snake</h2>
      <p>Classic snake game</p>
      <a href="snake/">Play</a>
    </div>


    <div class="game">
      <h2>❌ Tic Tac Toe</h2>
      <p>2 player tic tac toe</p>
      <a href="tic-tac-toe/">Play</a>
    </div>


    <div class="game">
      <h2>☄️ Meteor Mayhem</h2>
      <p>Dodge meteors and survive!</p>
      <a href="meteor-mayhem/">Play</a>
    </div>


    <div class="game">
      <h2>🧟 Zombie Survival</h2>
      <p>Fight zombies, survive waves, and upgrade.</p>
      <a href="zombie-survival/">Play</a>
    </div>

  </div>


  <footer>
    Enzo's Game Hub • Version 1.0
  </footer>

</body>
</html>
