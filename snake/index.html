<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Snake</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #102030, #05070b 55%);
      color: white;
      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-container {
      width: min(95%, 760px);
      text-align: center;
      padding: 20px;
    }

    h1 {
      margin: 5px 0 15px;
      font-size: 48px;
      letter-spacing: 4px;
      text-shadow:
        0 0 10px #00ff99,
        0 0 25px #00ff99;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 15px;
    }

    .stat {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(0, 255, 153, 0.35);
      border-radius: 12px;
      padding: 10px;
    }

    .stat-name {
      color: #9ca7b3;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: bold;
      color: #00ff99;
      margin-top: 3px;
    }

    .game-area {
      position: relative;
    }

    canvas {
      width: 100%;
      max-width: 650px;
      aspect-ratio: 1 / 1;
      background: #05090d;
      border: 2px solid #00ff99;
      border-radius: 15px;

      box-shadow:
        0 0 15px rgba(0, 255, 153, 0.45),
        0 0 40px rgba(0, 255, 153, 0.15);
    }

    .overlay {
      position: absolute;
      inset: 0;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      background: rgba(0, 0, 0, 0.55);
      border-radius: 15px;

      backdrop-filter: blur(4px);
    }

    .overlay.hidden {
      display: none;
    }

    .overlay h2 {
      font-size: 42px;
      margin: 0 0 10px;

      text-shadow:
        0 0 15px #00ff99;
    }

    .overlay p {
      color: #ccc;
      margin: 5px 20px 20px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 25px;

      background: #00ff99;
      color: #04110b;

      font-size: 17px;
      font-weight: bold;
      cursor: pointer;

      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 18px #00ff99;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .controls button {
      min-width: 120px;
    }

    .instructions {
      color: #929aa5;
      font-size: 14px;
      margin-top: 15px;
    }

    .mobile-controls {
      margin: 20px auto 0;
      width: 190px;

      display: grid;
      grid-template-columns: repeat(3, 60px);
      gap: 5px;
      justify-content: center;
    }

    .mobile-controls button {
      min-width: 0;
      height: 55px;
      padding: 0;
      font-size: 22px;
      background: #182129;
      color: white;
      border: 1px solid #00ff99;
    }

    .empty {
      visibility: hidden;
    }

    @media (min-width: 850px) {
      .mobile-controls {
        display: none;
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 34px;
      }

      .stat-value {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="game-container">

    <h1>NEON SNAKE</h1>

    <div class="stats">

      <div class="stat">
        <div class="stat-name">Score</div>
        <div class="stat-value" id="score">0</div>
      </div>

      <div class="stat">
        <div class="stat-name">Best</div>
        <div class="stat-value" id="best">0</div>
      </div>

      <div class="stat">
        <div class="stat-name">Level</div>
        <div class="stat-value" id="level">1</div>
      </div>

    </div>


    <div class="game-area">

      <canvas
        id="game"
        width="600"
        height="600">
      </canvas>

      <div class="overlay" id="overlay">

        <h2 id="overlayTitle">
          NEON SNAKE
        </h2>

        <p id="overlayText">
          Eat the food. Grow longer. Don't crash.
        </p>

        <button id="startButton">
          START GAME
        </button>

      </div>

    </div>


    <div class="controls">

      <button id="pauseButton">
        Pause
      </button>

      <button id="restartButton">
        Restart
      </button>

    </div>


    <div class="mobile-controls">

      <div class="empty"></div>

      <button data-direction="up">
        ▲
      </button>

      <div class="empty"></div>

      <button data-direction="left">
        ◀
      </button>

      <button data-direction="down">
        ▼
      </button>

      <button data-direction="right">
        ▶
      </button>

    </div>


    <p class="instructions">
      Arrow Keys / WASD • Space = Pause • R = Restart
      <br>
      Golden food is worth 3 points!
    </p>

  </div>


  <script>

    const canvas =
      document.getElementById("game");

    const ctx =
      canvas.getContext("2d");


    const scoreElement =
      document.getElementById("score");

    const bestElement =
      document.getElementById("best");

    const levelElement =
      document.getElementById("level");


    const overlay =
      document.getElementById("overlay");

    const overlayTitle =
      document.getElementById("overlayTitle");

    const overlayText =
      document.getElementById("overlayText");


    const startButton =
      document.getElementById("startButton");

    const pauseButton =
      document.getElementById("pauseButton");

    const restartButton =
      document.getElementById("restartButton");


    const gridSize = 24;

    const tileSize =
      canvas.width / gridSize;


    let snake;

    let direction;

    let nextDirection;

    let food;

    let particles = [];

    let score = 0;

    let level = 1;

    let bestScore = 0;

    let gameRunning = false;

    let paused = false;

    let gameOver = false;

    let lastMoveTime = 0;


    try {

      bestScore =
        Number(localStorage.getItem("snakeBest")) || 0;

    } catch (error) {

      bestScore = 0;

    }


    bestElement.textContent =
      bestScore;


    function resetGame() {

      snake = [
        { x: 12, y: 12 },
        { x: 11, y: 12 },
        { x: 10, y: 12 },
        { x: 9, y: 12 }
      ];


      direction = {
        x: 1,
        y: 0
      };


      nextDirection = {
        x: 1,
        y: 0
      };


      score = 0;

      level = 1;

      particles = [];

      paused = false;

      gameOver = false;


      spawnFood();

      updateStats();

    }


    function startGame() {

      resetGame();

      gameRunning = true;

      overlay.classList.add("hidden");

      pauseButton.textContent =
        "Pause";

      lastMoveTime =
        performance.now();

    }


    function restartGame() {

      startGame();

    }


    function togglePause() {

      if (!gameRunning || gameOver) {
        return;
      }


      paused = !paused;


      if (paused) {

        pauseButton.textContent =
          "Resume";

        showOverlay(
          "PAUSED",
          "Press Space or Resume to keep playing.",
          "RESUME"
        );

      } else {

        pauseButton.textContent =
          "Pause";

        overlay.classList.add("hidden");

        lastMoveTime =
          performance.now();

      }

    }


    function showOverlay(
      title,
      message,
      buttonText
    ) {

      overlayTitle.textContent =
        title;

      overlayText.textContent =
        message;

      startButton.textContent =
        buttonText;

      overlay.classList.remove("hidden");

    }


    function updateStats() {

      scoreElement.textContent =
        score;

      level =
        Math.floor(score / 5) + 1;

      levelElement.textContent =
        level;


      if (score > bestScore) {

        bestScore = score;

        bestElement.textContent =
          bestScore;


        try {

          localStorage.setItem(
            "snakeBest",
            bestScore
          );

        } catch (error) {
        }

      }

    }


    function getSpeed() {

      return Math.max(
        55,
        135 - ((level - 1) * 8)
      );

    }


    function spawnFood() {

      let position;


      do {

        position = {

          x: Math.floor(
            Math.random() * gridSize
          ),

          y: Math.floor(
            Math.random() * gridSize
          )

        };

      } while (
        snake &&
        snake.some(
          segment =>
            segment.x === position.x &&
            segment.y === position.y
        )
      );


      const golden =
        Math.random() < 0.14;


      food = {

        x: position.x,

        y: position.y,

        type: golden
          ? "gold"
          : "normal",

        value: golden
          ? 3
          : 1

      };

    }


    function changeDirection(x, y) {

      if (
        x === -direction.x &&
        y === -direction.y
      ) {

        return;

      }


      nextDirection = {
        x: x,
        y: y
      };

    }


    function updateGame() {

      direction =
        nextDirection;


      const newHead = {

        x:
          snake[0].x +
          direction.x,

        y:
          snake[0].y +
          direction.y

      };


      const eating =

        newHead.x === food.x &&

        newHead.y === food.y;


      if (
        newHead.x < 0 ||
        newHead.x >= gridSize ||
        newHead.y < 0 ||
        newHead.y >= gridSize
      ) {

        endGame();

        return;

      }


      let bodyLength =
        snake.length;


      if (!eating) {

        bodyLength--;

      }


      for (
        let i = 0;
        i < bodyLength;
        i++
      ) {

        if (
          snake[i].x === newHead.x &&
          snake[i].y === newHead.y
        ) {

          endGame();

          return;

        }

      }


      snake.unshift(
        newHead
      );


      if (eating) {

        score +=
          food.value;


        createParticles(
          food.x,
          food.y,
          food.type
        );


        updateStats();

        spawnFood();

      } else {

        snake.pop();

      }

    }


    function createParticles(
      gridX,
      gridY,
      type
    ) {

      for (
        let i = 0;
        i < 18;
        i++
      ) {

        particles.push({

          x:
            gridX * tileSize +
            tileSize / 2,

          y:
            gridY * tileSize +
            tileSize / 2,

          vx:
            (Math.random() - 0.5) * 5,

          vy:
            (Math.random() - 0.5) * 5,

          life: 1,

          type: type

        });

      }

    }


    function updateParticles() {

      for (
        let i =
          particles.length - 1;
        i >= 0;
        i--
      ) {

        const particle =
          particles[i];


        particle.x +=
          particle.vx;

        particle.y +=
          particle.vy;

        particle.life -=
          0.035;


        if (
          particle.life <= 0
        ) {

          particles.splice(
            i,
            1
          );

        }

      }

    }


    function drawBackground() {

      ctx.fillStyle =
        "#05090d";

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      ctx.strokeStyle =
        "rgba(0,255,153,0.07)";

      ctx.lineWidth = 1;


      for (
        let i = 0;
        i <= gridSize;
        i++
      ) {

        const position =
          i * tileSize;


        ctx.beginPath();

        ctx.moveTo(
          position,
          0
        );

        ctx.lineTo(
          position,
          canvas.height
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
          0,
          position
        );

        ctx.lineTo(
          canvas.width,
          position
        );

        ctx.stroke();

      }

    }


    function drawSnake() {

      for (
        let i = snake.length - 1;
        i >= 0;
        i--
      ) {

        const segment =
          snake[i];


        const x =
          segment.x * tileSize;

        const y =
          segment.y * tileSize;


        const brightness =
          Math.max(
            100,
            255 - i * 5
          );


        ctx.shadowBlur =
          i === 0
            ? 20
            : 10;

        ctx.shadowColor =
          "#00ff99";


        ctx.fillStyle =
          i === 0
            ? "#7affc5"
            : `rgb(0, ${brightness}, 130)`;


        roundedRect(
          x + 2,
          y + 2,
          tileSize - 4,
          tileSize - 4,
          6
        );


        ctx.fill();

      }


      ctx.shadowBlur = 0;


      drawEyes();

    }


    function drawEyes() {

      const head =
        snake[0];


      const centerX =
        head.x * tileSize +
        tileSize / 2;

      const centerY =
        head.y * tileSize +
        tileSize / 2;


      let offsetX =
        direction.x * 5;

      let offsetY =
        direction.y * 5;


      ctx.fillStyle =
        "#00150c";


      ctx.beginPath();

      ctx.arc(
        centerX +
        offsetX -
        direction.y * 5,
        centerY +
        offsetY +
        direction.x * 5,
        2.5,
        0,
        Math.PI * 2
      );

      ctx.fill();


      ctx.beginPath();

      ctx.arc(
        centerX +
        offsetX +
        direction.y * 5,
        centerY +
        offsetY -
        direction.x * 5,
        2.5,
        0,
        Math.PI * 2
      );

      ctx.fill();

    }


    function drawFood() {

      const centerX =
        food.x * tileSize +
        tileSize / 2;

      const centerY =
        food.y * tileSize +
        tileSize / 2;


      const pulse =
        1 +
        Math.sin(
          performance.now() / 150
        ) * 0.08;


      const radius =
        tileSize *
        0.32 *
        pulse;


      if (
        food.type === "gold"
      ) {

        ctx.shadowColor =
          "#ffd700";

        ctx.shadowBlur =
          25;

        ctx.fillStyle =
          "#ffd700";

      } else {

        ctx.shadowColor =
          "#ff3864";

        ctx.shadowBlur =
          20;

        ctx.fillStyle =
          "#ff3864";

      }


      ctx.beginPath();

      ctx.arc(
        centerX,
        centerY,
        radius,
        0,
        Math.PI * 2
      );

      ctx.fill();


      ctx.shadowBlur = 0;


      ctx.fillStyle =
        "#46ff7a";


      ctx.fillRect(
        centerX + 2,
        centerY - radius - 5,
        4,
        7
      );

    }


    function drawParticles() {

      for (
        const particle
        of particles
      ) {

        ctx.globalAlpha =
          particle.life;


        ctx.fillStyle =

          particle.type === "gold"

            ? "#ffd700"

            : "#ff3864";


        ctx.fillRect(
          particle.x,
          particle.y,
          5,
          5
        );

      }


      ctx.globalAlpha = 1;

    }


    function roundedRect(
      x,
      y,
      width,
      height,
      radius
    ) {

      ctx.beginPath();

      ctx.roundRect(
        x,
        y,
        width,
        height,
        radius
      );

    }


    function draw() {

      drawBackground();

      drawFood();

      drawSnake();

      drawParticles();

    }


    function endGame() {

      gameRunning =
        false;

      gameOver =
        true;


      showOverlay(

        "GAME OVER",

        "Score: " +
        score +
        " • Best: " +
        bestScore,

        "PLAY AGAIN"

      );

    }


    function gameLoop(time) {

      updateParticles();


      if (
        gameRunning &&
        !paused
      ) {

        if (
          time -
          lastMoveTime >=
          getSpeed()
        ) {

          updateGame();

          lastMoveTime =
            time;

        }

      }


      if (snake) {

        draw();

      }


      requestAnimationFrame(
        gameLoop
      );

    }


    document.addEventListener(
      "keydown",
      function(event) {

        const key =
          event.key.toLowerCase();


        if (
          [
            "arrowup",
            "arrowdown",
            "arrowleft",
            "arrowright",
            " "
          ].includes(key)
        ) {

          event.preventDefault();

        }


        if (
          key === "arrowup" ||
          key === "w"
        ) {

          changeDirection(
            0,
            -1
          );

        }


        if (
          key === "arrowdown" ||
          key === "s"
        ) {

          changeDirection(
            0,
            1
          );

        }


        if (
          key === "arrowleft" ||
          key === "a"
        ) {

          changeDirection(
            -1,
            0
          );

        }


        if (
          key === "arrowright" ||
          key === "d"
        ) {

          changeDirection(
            1,
            0
          );

        }


        if (
          event.code === "Space"
        ) {

          togglePause();

        }


        if (
          key === "r"
        ) {

          restartGame();

        }

      }
    );


    startButton.addEventListener(
      "click",
      function() {

        if (paused) {

          togglePause();

        } else {

          startGame();

        }

      }
    );


    pauseButton.addEventListener(
      "click",
      togglePause
    );


    restartButton.addEventListener(
      "click",
      restartGame
    );


    document
      .querySelectorAll(
        "[data-direction]"
      )
      .forEach(
        function(button) {

          button.addEventListener(
            "click",
            function() {

              const dir =
                button.dataset.direction;


              if (dir === "up") {

                changeDirection(
                  0,
                  -1
                );

              }


              if (dir === "down") {

                changeDirection(
                  0,
                  1
                );

              }


              if (dir === "left") {

                changeDirection(
                  -1,
                  0
                );

              }


              if (dir === "right") {

                changeDirection(
                  1,
                  0
                );

              }

            }
          );

        }
      );


    resetGame();

    draw();

    requestAnimationFrame(
      gameLoop
    );

  </script>

</body>
</html>
