<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #1b2140, #090b14 65%);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: min(92%, 520px);
      text-align: center;
      padding: 25px;
    }

    h1 {
      font-size: 46px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 20px;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .score-box {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 12px;
    }

    .score-title {
      color: #aaa;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .score-value {
      font-size: 28px;
      font-weight: bold;
      margin-top: 4px;
    }

    .status {
      font-size: 22px;
      margin-bottom: 18px;
      min-height: 28px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .cell {
      aspect-ratio: 1 / 1;
      background: #151824;
      border: 2px solid #34394f;
      border-radius: 14px;
      color: white;
      font-size: 62px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .cell:hover {
      background: #1d2233;
      transform: scale(1.03);
    }

    .cell.x {
      color: #5ea0ff;
      text-shadow: 0 0 18px rgba(94,160,255,0.6);
    }

    .cell.o {
      color: #ff5d8f;
      text-shadow: 0 0 18px rgba(255,93,143,0.6);
    }

    .winner {
      border-color: #ffd54a;
      box-shadow: 0 0 20px rgba(255,213,74,0.5);
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 22px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #6474ff;
      color: white;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .secondary {
      background: #2c3143;
    }

    @media(max-width: 500px) {
      h1 {
        font-size: 36px;
      }

      .cell {
        font-size: 48px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>❌ Tic Tac Toe ⭕</h1>

    <p class="subtitle">
      2 Player Battle
    </p>

    <div class="scoreboard">

      <div class="score-box">
        <div class="score-title">PLAYER X</div>
        <div class="score-value" id="xScore">0</div>
      </div>

      <div class="score-box">
        <div class="score-title">DRAWS</div>
        <div class="score-value" id="drawScore">0</div>
      </div>

      <div class="score-box">
        <div class="score-title">PLAYER O</div>
        <div class="score-value" id="oScore">0</div>
      </div>

    </div>

    <div class="status" id="status">
      Player X's turn
    </div>

    <div class="board" id="board">

      <button class="cell" data-index="0"></button>
      <button class="cell" data-index="1"></button>
      <button class="cell" data-index="2"></button>

      <button class="cell" data-index="3"></button>
      <button class="cell" data-index="4"></button>
      <button class="cell" data-index="5"></button>

      <button class="cell" data-index="6"></button>
      <button class="cell" data-index="7"></button>
      <button class="cell" data-index="8"></button>

    </div>

    <div class="buttons">

      <button id="restartButton">
        New Round
      </button>

      <button id="resetScoreButton" class="secondary">
        Reset Scores
      </button>

    </div>

  </div>

  <script>

    const cells =
      document.querySelectorAll(".cell");

    const statusText =
      document.getElementById("status");

    const restartButton =
      document.getElementById("restartButton");

    const resetScoreButton =
      document.getElementById("resetScoreButton");

    const xScoreText =
      document.getElementById("xScore");

    const oScoreText =
      document.getElementById("oScore");

    const drawScoreText =
      document.getElementById("drawScore");


    let board = [
      "", "", "",
      "", "", "",
      "", "", ""
    ];

    let currentPlayer = "X";

    let gameActive = true;

    let xScore = 0;
    let oScore = 0;
    let drawScore = 0;


    const winningPatterns = [

      [0, 1, 2],
      [3, 4, 5],
      [6, 7, 8],

      [0, 3, 6],
      [1, 4, 7],
      [2, 5, 8],

      [0, 4, 8],
      [2, 4, 6]

    ];


    function handleCellClick(event) {

      const cell =
        event.target;

      const index =
        Number(cell.dataset.index);


      if (
        board[index] !== "" ||
        !gameActive
      ) {
        return;
      }


      board[index] =
        currentPlayer;

      cell.textContent =
        currentPlayer;


      if (currentPlayer === "X") {
        cell.classList.add("x");
      } else {
        cell.classList.add("o");
      }


      checkWinner();

    }


    function checkWinner() {

      let winningPattern = null;


      for (
        let i = 0;
        i < winningPatterns.length;
        i++
      ) {

        const pattern =
          winningPatterns[i];

        const a = pattern[0];
        const b = pattern[1];
        const c = pattern[2];


        if (
          board[a] !== "" &&
          board[a] === board[b] &&
          board[a] === board[c]
        ) {

          winningPattern =
            pattern;

          break;

        }

      }


      if (winningPattern) {

        gameActive = false;


        for (
          let i = 0;
          i < winningPattern.length;
          i++
        ) {

          const winningCell =
            cells[winningPattern[i]];

          winningCell.classList.add(
            "winner"
          );

        }


        statusText.textContent =
          "Player " +
          currentPlayer +
          " wins! 🎉";


        if (currentPlayer === "X") {

          xScore++;

          xScoreText.textContent =
            xScore;

        } else {

          oScore++;

          oScoreText.textContent =
            oScore;

        }


        return;

      }


      if (
        !board.includes("")
      ) {

        gameActive = false;

        drawScore++;

        drawScoreText.textContent =
          drawScore;

        statusText.textContent =
          "It's a draw!";

        return;

      }


      if (currentPlayer === "X") {

        currentPlayer = "O";

      } else {

        currentPlayer = "X";

      }


      statusText.textContent =
        "Player " +
        currentPlayer +
        "'s turn";

    }


    function restartGame() {

      board = [
        "", "", "",
        "", "", "",
        "", "", ""
      ];

      currentPlayer = "X";

      gameActive = true;


      statusText.textContent =
        "Player X's turn";


      cells.forEach(
        function(cell) {

          cell.textContent = "";

          cell.classList.remove(
            "x",
            "o",
            "winner"
          );

        }
      );

    }


    function resetScores() {

      xScore = 0;

      oScore = 0;

      drawScore = 0;


      xScoreText.textContent = 0;

      oScoreText.textContent = 0;

      drawScoreText.textContent = 0;


      restartGame();

    }


    cells.forEach(
      function(cell) {

        cell.addEventListener(
          "click",
          handleCellClick
        );

      }
    );


    restartButton.addEventListener(
      "click",
      restartGame
    );


    resetScoreButton.addEventListener(
      "click",
      resetScores
    );

  </script>

</body>
</html>
